<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">SOP_GengXin - 洗衣机岗位 SOP 版式焕新</title>
  <desc id="desc">旧版工艺信息经过提取、规则映射和模板保真处理，生成可审核的新版 Excel SOP。</desc>
  <rect width="1200" height="380" rx="24" fill="#0B1F33"/>
  <path d="M52 82H1148M52 318H1148" stroke="#6F8EAA" stroke-opacity=".42"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="76" fill="#84D3C5" font-size="20" font-weight="700" letter-spacing="2">EXCEL SOP RENEWAL TOOLKIT</text>
    <text x="58" y="150" fill="#F5F9FC" font-size="62" font-weight="800">SOP_GengXin</text>
    <text x="58" y="198" fill="#C9D8E5" font-size="28" font-weight="600">把旧版岗位 SOP 转换为可审核的新版工艺文件</text>
    <text x="58" y="238" fill="#94ADBF" font-size="21">保留工艺内容，复用标准模板，并校验图片、标记与打印版式。</text>
    <text x="58" y="294" fill="#84D3C5" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">legacy .xlsx  →  structured model  →  renewed .xlsx</text>
  </g>
  <g transform="translate(755 56)">
